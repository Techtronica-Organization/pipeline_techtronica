
services:
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:29092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  monitoring_service:
    build: .
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - TELEMETRY_TOPIC=telemetry
      - FAILURES_TOPIC=failures
      # Segundos reais por 1h simulada. Default 60 (demo). Tempo real: 3600. Teste rápido: 5.
      - SIMULATION_INTERVAL_SEC=${SIMULATION_INTERVAL_SEC:-60.0}
      - HOSPITAL_ID=1
      - NUM_HOSPITALS=10
      - CSV_PATH=/app/csv_export/equipamentos.csv
      - PYTHONUNBUFFERED=1
    volumes:
      - ./persistence:/app/monitoring_service/persistence
      - ../csv_export:/app/csv_export:ro
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-strongpassword123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  data_pipeline:
    build:
      context: ..
      dockerfile: data_pipeline/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - TELEMETRY_TOPIC=telemetry
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-admin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-strongpassword123}
      - DB_DIALECT=${DB_DIALECT:-mysql+pymysql}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-supersenha}
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-techtronica_pipeline}
      - USE_SQL_DB=true
      - PIPELINE_ENV=${PIPELINE_ENV:-dev}
      - PYTHONUNBUFFERED=1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from sqlalchemy import text; from data_pipeline.database.connection import engine; c=engine.connect(); c.execute(text('SELECT 1 FROM silver_telemetry LIMIT 1')); c.close()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - default
      - techtronica-network
    restart: unless-stopped

  serving_api:
    build:
      context: ..
      dockerfile: serving_api/Dockerfile
    ports:
      - "${PIPELINE_API_PORT:-8100}:8000"
    depends_on:
      data_pipeline:
        condition: service_healthy
    environment:
      - DB_DIALECT=${DB_DIALECT:-mysql+pymysql}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-supersenha}
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-techtronica_pipeline}
      - USE_SQL_DB=true
      - PYTHONUNBUFFERED=1
      - PIPELINE_ENV=${PIPELINE_ENV:-dev}
      - PIPELINE_INTERNAL_TOKEN=${PIPELINE_INTERNAL_TOKEN:-dev-pipeline-internal-token}
      - SIMULATION_DB_PATH=/app/monitoring_service/persistence/simulation.db
      - CSV_PATH=/app/csv_export/equipamentos.csv
    volumes:
      - ./persistence:/app/monitoring_service/persistence
      - ../csv_export:/app/csv_export:ro
    networks:
      - default
      - techtronica-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  prediction_worker:
    build:
      context: ..
      dockerfile: prediction_worker/Dockerfile
    depends_on:
      data_pipeline:
        condition: service_healthy
    environment:
      - DB_DIALECT=${DB_DIALECT:-mysql+pymysql}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-supersenha}
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-techtronica_pipeline}
      - USE_SQL_DB=true
      - MODELS_DIR=/app/models
      - PIPELINE_ENV=${PIPELINE_ENV:-dev}
      - BACKEND_API_BASE_URL=${BACKEND_API_BASE_URL:-http://host.docker.internal:8000}
      - TELEMETRY_WEBHOOK_SECRET=${TELEMETRY_WEBHOOK_SECRET:-dev-telemetry-webhook-secret}
      - PREDICTION_POLL_INTERVAL_SEC=${PREDICTION_POLL_INTERVAL_SEC:-10}
      - PREDICTION_BATCH_SIZE=${PREDICTION_BATCH_SIZE:-20}
      - PREDICTION_LEASE_SECONDS=${PREDICTION_LEASE_SECONDS:-120}
      - PREDICTION_MAX_ATTEMPTS=${PREDICTION_MAX_ATTEMPTS:-5}
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - techtronica-network
    restart: unless-stopped

  external_data_api:
    build:
      context: ..
      dockerfile: external_data_api/Dockerfile
    ports:
      - "${EXTERNAL_DATA_API_PORT:-8200}:8000"
    environment:
      - EXTERNAL_API_KEY=${EXTERNAL_API_KEY:-dev-external-api-key}
      - EXTERNAL_API_SECRET=${EXTERNAL_API_SECRET:-dev-external-api-secret}
      - EXTERNAL_JWT_SECRET=${EXTERNAL_JWT_SECRET:-dev-external-jwt-secret}
      - CSV_EXPORT_DIR=/app/csv_export
      - PYTHONUNBUFFERED=1
    volumes:
      - ../csv_export:/app/csv_export:ro
    networks:
      - default
      - techtronica-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped

volumes:
  kafka_data:
  minio_data:

networks:
  default:
  techtronica-network:
    external: true
    name: techtronica-network
